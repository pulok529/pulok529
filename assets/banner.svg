      <animate attributeName="r" values="4;5.4;4" dur="2.8s" begin="0.4s" repeatCount="indefinite" />
    </circle>
    <!-- Node 21 -->
    <circle cx="1025" cy="150" r="5" fill="#8B5CF6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" begin="1.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="5;6.8;5" dur="3.5s" begin="1.2s" repeatCount="indefinite" />
    </circle>
    <!-- Node 22 -->
    <circle cx="1040" cy="225" r="3.5" fill="#22D3EE" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" begin="1.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5;4.9;3.5" dur="2.7s" begin="1.8s" repeatCount="indefinite" />
    </circle>
    <!-- Node 23 -->
    <circle cx="1090" cy="60" r="3" fill="#8B5CF6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" begin="0.6s" repeatCount="indefinite" />
      <animate attributeName="r" values="3;4.3;3" dur="3.2s" begin="0.6s" repeatCount="indefinite" />
