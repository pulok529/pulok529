      <animate attributeName="r" values="3.5;4.8;3.5" dur="3.1s" begin="1.1s" repeatCount="indefinite" />
    </circle>
    <!-- Node 7 -->
    <circle cx="780" cy="60" r="3" fill="#8B5CF6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" begin="0.6s" repeatCount="indefinite" />
      <animate attributeName="r" values="3;4.3;3" dur="2.9s" begin="0.6s" repeatCount="indefinite" />
    </circle>
    <!-- Node 8 -->
    <circle cx="770" cy="140" r="4.5" fill="#22D3EE" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.3s" begin="1.6s" repeatCount="indefinite" />
      <animate attributeName="r" values="4.5;6.0;4.5" dur="3.3s" begin="1.6s" repeatCount="indefinite" />
    </circle>
    <!-- Node 9 -->
    <circle cx="790" cy="230" r="3" fill="#22D3EE" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" begin="0.3s" repeatCount="indefinite" />
      <animate attributeName="r" values="3;4.4;3" dur="2.5s" begin="0.3s" repeatCount="indefinite" />
    </circle>
    <!-- Node 10 -->
    <circle cx="830" cy="90" r="3.5" fill="#8B5CF6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" begin="1.3s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5;4.9;3.5" dur="3.5s" begin="1.3s" repeatCount="indefinite" />
    </circle>
    <!-- Node 11 -->
    <circle cx="840" cy="175" r="5" fill="#22D3EE" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="0.7s" repeatCount="indefinite" />
      <animate attributeName="r" values="5;6.8;5" dur="2.8s" begin="0.7s" repeatCount="indefinite" />
    </circle>
    <!-- Node 12 -->
    <circle cx="860" cy="265" r="3" fill="#8B5CF6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.0s" begin="2.1s" repeatCount="indefinite" />
      <animate attributeName="r" values="3;4.3;3" dur="3.0s" begin="2.1s" repeatCount="indefinite" />
    </circle>
    <!-- Node 13 -->
    <circle cx="890" cy="65" r="4" fill="#22D3EE" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;5.5;4" dur="3.2s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    <!-- Node 14 -->
    <circle cx="900" cy="135" r="3.5" fill="#8B5CF6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" begin="1.7s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5;4.8;3.5" dur="2.7s" begin="1.7s" repeatCount="indefinite" />
    </circle>
    <!-- Node 15 -->
    <circle cx="910" cy="215" r="4" fill="#22D3EE" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" begin="0.9s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;5.4;4" dur="3.4s" begin="0.9s" repeatCount="indefinite" />
    </circle>
    <!-- Node 16 -->
    <circle cx="960" cy="50" r="3" fill="#8B5CF6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" begin="0.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="3;4.3;3" dur="2.6s" begin="0.2s" repeatCount="indefinite" />
    </circle>
    <!-- Node 17 -->
    <circle cx="970" cy="110" r="4.5" fill="#22D3EE" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" begin="1.5s" repeatCount="indefinite" />
      <animate attributeName="r" values="4.5;6.1;4.5" dur="3.1s" begin="1.5s" repeatCount="indefinite" />
    </circle>
    <!-- Node 18 -->
    <circle cx="950" cy="180" r="3.5" fill="#8B5CF6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" begin="0.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5;4.8;3.5" dur="2.9s" begin="0.8s" repeatCount="indefinite" />
