<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Naimul Islam, Full Stack Developer and AI Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080B"/><stop offset="1" stop-color="#0C1217"/></linearGradient>
 <pattern id="gr" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#2EF2FF" stroke-opacity=".07"/></pattern>
 <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2EF2FF" stop-opacity="0"/><stop offset="1" stop-color="#2EF2FF" stop-opacity=".18"/></linearGradient>
 <radialGradient id="glow" cx=".75" cy=".46" r=".35"><stop offset="0" stop-color="#2EF2FF" stop-opacity=".18"/><stop offset="1" stop-color="#2EF2FF" stop-opacity="0"/></radialGradient>
 <clipPath id="cl"><rect width="1000" height="260" rx="18"/></clipPath>
</defs>
<style>
.scan{animation:scan 4.5s linear infinite}@keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(270px)}}
.draw{stroke-dasharray:900;animation:draw 5s ease-out infinite alternate}@keyframes draw{0%{stroke-dashoffset:900}60%,100%{stroke-dashoffset:0}}
.spin{transform-origin:770px 120px;animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise .8s ease-out both}.r2{animation-delay:.25s}.r3{animation-delay:.5s}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.caret{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.scan,.draw,.spin,.rise,.caret,.pulse{animation:none}}
</style>
<g clip-path="url(#cl)">
 <rect width="1000" height="260" fill="url(#bg)"/><rect width="1000" height="260" fill="url(#gr)"/><rect width="1000" height="260" fill="url(#glow)"/>
 <rect class="scan" x="0" y="0" width="1000" height="40" fill="url(#scan)"/>
</g>
<rect x=".5" y=".5" width="999" height="259" rx="17.5" fill="none" stroke="#2EF2FF" stroke-opacity=".25"/>
<text class="rise" x="56" y="74" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="15" fill="#2EF29A">&gt; whoami<tspan class="caret" fill="#2EF2FF">_</tspan></text>
<text class="rise r2" x="54" y="130" font-family="'Chakra Petch','Segoe UI',Ubuntu,Arial,sans-serif" font-weight="700" font-size="52" letter-spacing="3" fill="#E6F6FF">NAIMUL ISLAM</text>
<text class="rise r2" x="56" y="166" font-family="'Chakra Petch','Segoe UI',Ubuntu,Arial,sans-serif" font-size="21" fill="#2EF2FF">Full Stack Developer · AI Engineer</text>
<text class="rise r3" x="56" y="202" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" fill="#C3D6E0">React · Next.js · TypeScript · Node / .NET · SQL · DevOps · LLMs and RAG</text>
<text class="rise r3" x="56" y="228" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="12" fill="#7E97A6">Dhaka · remote</text>
<g transform="translate(770 120)">
 <g class="spin" transform="translate(-770 -120)"><circle cx="770" cy="120" r="92" fill="none" stroke="#A66BFF" stroke-opacity=".35" stroke-dasharray="4 10"/></g>
 <path class="draw" d="M0,-70 L60.6,-35 L60.6,35 L0,70 L-60.6,35 L-60.6,-35 Z M0,-70 L0,0 M60.6,35 L0,0 M-60.6,35 L0,0" fill="none" stroke="#2EF2FF" stroke-width="2.2" stroke-linejoin="round"/>
 <path d="M0,-70 L60.6,-35 L0,0 L-60.6,-35 Z" fill="#2EF2FF" fill-opacity=".07"/>
 <circle class="pulse" cx="0" cy="0" r="5" fill="#2EF2FF"/>
</g>
</svg>
