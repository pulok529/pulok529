<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img" aria-label="GridMind: Home AI cluster dashboard" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1217"/><stop offset="1" stop-color="#070C10"/></linearGradient>
 <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#2EF29A" stop-opacity="0"/><stop offset=".5" stop-color="#2EF29A" stop-opacity=".9"/><stop offset="1" stop-color="#2EF29A" stop-opacity="0"/></linearGradient>
 <pattern id="gr" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#2EF29A" stroke-opacity=".05"/></pattern>
 <clipPath id="cl"><rect width="420" height="150" rx="14"/></clipPath>
</defs>
<style>
.sh{animation:s 5s ease-in-out infinite}@keyframes s{0%{transform:translateX(-420px)}60%,100%{transform:translateX(420px)}}
.dot{animation:p 2.4s ease-in-out infinite}@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
.ring{stroke-dasharray:160;animation:d 2.6s ease-out both}@keyframes d{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.sh,.dot,.ring{animation:none}}
</style>
<g clip-path="url(#cl)">
 <rect width="420" height="150" fill="url(#bg)"/><rect width="420" height="150" fill="url(#gr)"/>
 <rect x="0" y="0" width="4" height="150" fill="#2EF29A"/>
 <rect class="sh" x="0" y="0" width="420" height="2" fill="url(#sh)"/>
</g>
<rect x=".5" y=".5" width="419" height="149" rx="13.5" fill="none" stroke="#2EF29A" stroke-opacity=".28"/>
<path class="dot" d="M44.0,26.0 L61.3,36.0 L61.3,56.0 L44.0,66.0 L26.7,56.0 L26.7,36.0 Z" fill="#2EF29A" fill-opacity=".12" stroke="none"/><path d="M44.0,26.0 L61.3,36.0 L61.3,56.0 L44.0,66.0 L26.7,56.0 L26.7,36.0 Z" fill="none" stroke="#2EF29A" stroke-width="2" stroke-linejoin="round"/>
<text x="44" y="50" text-anchor="middle" font-family="'Chakra Petch','Segoe UI',Ubuntu,Arial,sans-serif" font-weight="700" font-size="12" fill="#E6F6FF">GM</text>
<text x="80" y="46" font-family="'Chakra Petch','Segoe UI',Ubuntu,Arial,sans-serif" font-weight="700" font-size="19" fill="#E6F6FF">GridMind</text>
<circle class="dot" cx="396" cy="40" r="4" fill="#2EF29A"/>
<text x="80" y="68" font-family="'Chakra Petch','Segoe UI',Ubuntu,Arial,sans-serif" font-size="13" fill="#C3D6E0">Home AI cluster dashboard</text>
<line x1="80" y1="112" x2="398" y2="112" stroke="#2EF29A" stroke-opacity=".15"/>
<text x="80" y="133" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="11" fill="#2EF29A">SvelteKit 2, Svelte 5 (runes), TypeScript</text>

</svg>
