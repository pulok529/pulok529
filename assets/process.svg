<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="How a project goes: collect, design, build, ship" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.dot{animation:t 6s linear infinite}@keyframes t{from{transform:translateX(0)}to{transform:translateX(735px)}}
