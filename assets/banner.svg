      <animate attributeName="r" values="4;5.5;4" dur="2.9s" begin="1.4s" repeatCount="indefinite" />
    </circle>
    <!-- Node 25 -->
    <circle cx="1085" cy="190" r="3" fill="#8B5CF6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.0s" begin="0.3s" repeatCount="indefinite" />
      <animate attributeName="r" values="3;4.3;3" dur="3.0s" begin="0.3s" repeatCount="indefinite" />
    </circle>
    <!-- Node 26 -->
    <circle cx="1135" cy="165" r="4.5" fill="#22D3EE" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.3s" begin="1.0s" repeatCount="indefinite" />
      <animate attributeName="r" values="4.5;6.1;4.5" dur="3.3s" begin="1.0s" repeatCount="indefinite" />
    </circle>
    <!-- Node 27 -->
    <circle cx="1140" cy="245" r="3" fill="#8B5CF6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" begin="2.0s" repeatCount="indefinite" />
      <animate attributeName="r" values="3;4.4;3" dur="2.6s" begin="2.0s" repeatCount="indefinite" />
    </circle>

    <!-- Left-side text block (Fades in over 1.2s) -->
    <g class="text-fade-group" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze" />

      <!-- Title / Name at x=60, y=140 -->
      <text x="60" y="140" class="name-text">Naimul Islam</text>

      <!-- Subtitle at x=60, y=180 -->
      <text x="60" y="180" class="sub-text">Senior Software Engineer</text>
      <text x="60" y="206" class="sub-text">.NET · Distributed Systems · Cloud · NLP</text>

      <!-- Cyan-to-violet gradient underline below subtitle -->
      <line x1="60" y1="226" x2="440" y2="226" stroke="url(#cyan-violet-grad)" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Outer card border with subtle glow gradient -->
    <rect width="1200" height="300" rx="16" fill="none" stroke="url(#border-grad)" stroke-width="1.5" />
  </g>
</svg>
