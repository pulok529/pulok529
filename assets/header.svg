<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Naimul Islam, Full Stack Developer and AI Engineer">
<defs>
<linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#2EF2FF" stop-opacity="0"/>
  <stop offset="1" stop-color="#2EF2FF" stop-opacity=".22"/>
</linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M32 0H0V32" fill="none" stroke="#2EF2FF" stroke-opacity=".07"/>
</pattern>
<clipPath id="cardClip">
  <rect width="880" height="240" rx="8"/>
</clipPath>
</defs>
<style>
@keyframes scan{0%{transform:translateY(-30px)}100%{transform:translateY(260px)}}
@keyframes draw{0%{stroke-dashoffset:900}60%,100%{stroke-dashoffset:0}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.scan{animation:scan 4.5s linear infinite}
.draw{stroke-dasharray:900;animation:draw 5s ease-out infinite alternate}
.spin{transform-origin:745px 120px;animation:spin 18s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.caret{animation:blink 1s step-end infinite}
@media (prefers-reduced-motion:reduce){.scan,.draw,.spin,.pulse,.caret{animation:none}}
</style>
<g clip-path="url(#cardClip)">
  <rect width="880" height="240" fill="#05080B"/>
  <rect width="880" height="240" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="880" height="30" fill="url(#scanG)"/>
</g>
<rect x=".5" y=".5" width="879" height="239" rx="8" fill="none" stroke="#2EF2FF" stroke-opacity=".18"/>
<path d="M14 34V14h20M846 14h20v20M866 206v20h-20M34 226H14v-20" fill="none" stroke="#2EF2FF" stroke-opacity=".7" stroke-width="2"/>
<text x="48" y="70" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" fill="#2EF29A">&gt; whoami<tspan class="caret" fill="#2EF2FF">_</tspan></text>
<text x="46" y="128" font-family="'Chakra Petch','Segoe UI',Ubuntu,sans-serif" font-size="54" font-weight="700" fill="#E6F6FF" letter-spacing="3">NAIMUL ISLAM</text>
<text x="48" y="162" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="17" fill="#2EF2FF">Full Stack Developer · AI Engineer</text>
<text x="48" y="196" font-family="'IBM Plex Sans','Segoe UI',sans-serif" font-size="14" fill="#7E97A6">React · Next.js · TypeScript · Node / .NET · SQL · DevOps · LLMs and RAG</text>
<g class="spin" opacity=".95">
  <polygon class="draw" points="745,48 807,84 807,156 745,192 683,156 683,84" fill="none" stroke="#2EF2FF" stroke-width="1.8"/>
  <path class="draw" d="M683 84L745 120L807 84M745 120V192" fill="none" stroke="#A66BFF" stroke-width="1.8"/>
</g>
<circle class="pulse" cx="745" cy="120" r="5" fill="#2EF2FF"/>
<text x="690" y="222" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="11" fill="#7E97A6">Dhaka · remote</text>
</svg>