<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img" aria-label="SunPlan: 3D rooftop solar planner with sun path and payback" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1217"/><stop offset="1" stop-color="#070C10"/></linearGradient>
 <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#FFB547" stop-opacity="0"/><stop offset=".5" stop-color="#FFB547" stop-opacity=".9"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></linearGradient>
 <pattern id="gr" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#FFB547" stroke-opacity=".05"/></pattern>
 <clipPath id="cl"><rect width="420" height="150" rx="14"/></clipPath>
</defs>
<style>
.sh{animation:s 2.4s linear infinite}@keyframes s{0%{transform:translateX(-420px)}100%{transform:translateX(420px)}}
.card-border{animation:bglow 3.2s ease-in-out infinite}@keyframes bglow{0%,100%{stroke-opacity:.25;stroke-width:1px}50%{stroke-opacity:.75;stroke-width:1.5px}}
.dot{animation:p 2s ease-in-out infinite}@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
.ping{animation:pg 2.2s cubic-bezier(0,0,0.2,1) infinite;transform-origin:396px 40px}@keyframes pg{0%{transform:scale(1);opacity:.85}100%{transform:scale(2.6);opacity:0}}
.ring{stroke-dasharray:35 15;animation:rdash 5s linear infinite}@keyframes rdash{0%{stroke-dashoffset:100}100%{stroke-dashoffset:0}}
.badge-bg{animation:bgpulse 2.8s ease-in-out infinite}@keyframes bgpulse{0%,100%{fill-opacity:.10}50%{fill-opacity:.24}}
.accent-line{animation:lpulse 3.2s ease-in-out infinite}@keyframes lpulse{0%,100%{stroke-opacity:.15}50%{stroke-opacity:.45}}
.edge-bar{animation:epulse 2.6s ease-in-out infinite}@keyframes epulse{0%,100%{opacity:.75}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.sh,.card-border,.dot,.ping,.ring,.badge-bg,.accent-line,.edge-bar{animation:none}}
</style>
<g clip-path="url(#cl)">
 <rect width="420" height="150" fill="url(#bg)"/><rect width="420" height="150" fill="url(#gr)"/>
 <rect class="edge-bar" x="0" y="0" width="4" height="150" fill="#FFB547"/>
 <rect class="sh" x="0" y="0" width="420" height="2" fill="url(#sh)"/>
</g>
<rect class="card-border" x=".5" y=".5" width="419" height="149" rx="13.5" fill="none" stroke="#FFB547" stroke-opacity=".28"/>
<path class="badge-bg" d="M24,46 A20,20 0 1 1 64,46 A20,20 0 1 1 24,46 Z" fill="#FFB547" fill-opacity=".12" stroke="none"/><path d="M24,46 A20,20 0 1 1 64,46 A20,20 0 1 1 24,46 Z" class="ring" fill="none" stroke="#FFB547" stroke-width="2" stroke-linejoin="round"/>
<text x="44" y="51" text-anchor="middle" font-family="'Chakra Petch','Segoe UI',Ubuntu,Arial,sans-serif" font-weight="700" font-size="15" fill="#E6F6FF">S</text>
<text x="80" y="46" font-family="'Chakra Petch','Segoe UI',Ubuntu,Arial,sans-serif" font-weight="700" font-size="19" fill="#E6F6FF">SunPlan</text>
<circle class="ping" cx="396" cy="40" r="4" fill="none" stroke="#FFB547" stroke-width="1.2"/><circle class="dot" cx="396" cy="40" r="4" fill="#FFB547"/>
<text x="80" y="68" font-family="'Chakra Petch','Segoe UI',Ubuntu,Arial,sans-serif" font-size="13" fill="#C3D6E0">3D rooftop solar planner with sun path and payback</text>
<line class="accent-line" x1="80" y1="112" x2="398" y2="112" stroke="#FFB547" stroke-opacity=".15"/>
<text x="80" y="133" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="11" fill="#FFB547">Next.js 16, React 19, TypeScript</text>

</svg>
