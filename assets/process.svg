<line x1="44" y1="40" x2="779" y2="40" stroke="#2EF2FF" stroke-opacity=".3" stroke-width="2" stroke-dasharray="3 6"/>
<g transform="translate(20 40)"><rect width="225" height="110" rx="12" fill="#0C1217" stroke="#2EF2FF" stroke-opacity=".35"/>
<circle cx="24" cy="-0" r="7" fill="#0C1217" stroke="#2EF2FF" stroke-width="2"/>
<text x="20" y="38" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" fill="#2EF2FF">01 / collect</text>
<text x="20" y="66" font-family="'Chakra Petch','Segoe UI',Ubuntu,Arial,sans-serif" font-size="13.5" fill="#C3D6E0">Client calls, written scope,</text>
<text x="20" y="86" font-family="'Chakra Petch','Segoe UI',Ubuntu,Arial,sans-serif" font-size="13.5" fill="#C3D6E0">acceptance criteria.</text></g><g transform="translate(265 40)"><rect width="225" height="110" rx="12" fill="#0C1217" stroke="#A66BFF" stroke-opacity=".35"/>
<circle cx="24" cy="-0" r="7" fill="#0C1217" stroke="#A66BFF" stroke-width="2"/>
<text x="20" y="38" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" fill="#A66BFF">02 / design</text>
<text x="20" y="66" font-family="'Chakra Petch','Segoe UI',Ubuntu,Arial,sans-serif" font-size="13.5" fill="#C3D6E0">Figma drafts on a token-based</text>
<text x="20" y="86" font-family="'Chakra Petch','Segoe UI',Ubuntu,Arial,sans-serif" font-size="13.5" fill="#C3D6E0">design system, signed off.</text></g><g transform="translate(510 40)"><rect width="225" height="110" rx="12" fill="#0C1217" stroke="#2EF29A" stroke-opacity=".35"/>
<circle cx="24" cy="-0" r="7" fill="#0C1217" stroke="#2EF29A" stroke-width="2"/>
<text x="20" y="38" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" fill="#2EF29A">03 / build</text>
<text x="20" y="66" font-family="'Chakra Petch','Segoe UI',Ubuntu,Arial,sans-serif" font-size="13.5" fill="#C3D6E0">React or Next.js in TypeScript,</text>
<text x="20" y="86" font-family="'Chakra Petch','Segoe UI',Ubuntu,Arial,sans-serif" font-size="13.5" fill="#C3D6E0">plus the API, SQL and tests.</text></g><g transform="translate(755 40)"><rect width="225" height="110" rx="12" fill="#0C1217" stroke="#FFB547" stroke-opacity=".35"/>
<circle cx="24" cy="-0" r="7" fill="#0C1217" stroke="#FFB547" stroke-width="2"/>
<text x="20" y="38" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" fill="#FFB547">04 / ship</text>
<text x="20" y="66" font-family="'Chakra Petch','Segoe UI',Ubuntu,Arial,sans-serif" font-size="13.5" fill="#C3D6E0">CI/CD, Docker, deploy,</text>
<text x="20" y="86" font-family="'Chakra Petch','Segoe UI',Ubuntu,Arial,sans-serif" font-size="13.5" fill="#C3D6E0">user manual, handover.</text></g>
